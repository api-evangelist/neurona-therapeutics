aid: neurona-therapeutics
name: Neurona Therapeutics
description: >-
  Neurona Therapeutics is a clinical-stage biotherapeutics company in South San Francisco, California,
  developing allogeneic regenerative neural cell therapies that permanently integrate into neural
  circuits to treat chronic disorders of the nervous system. Founded on nearly two decades of stem cell
  research from the University of California, San Francisco, its lead candidate NRTX-1001 (rezanecel) is
  an inhibitory interneuron cell therapy delivered as a single, minimally invasive dose for drug-resistant
  mesial temporal lobe epilepsy, and is advancing through the NTE001 and NTE002 studies toward the Phase 3
  EPIC trial. UCB completed its acquisition of Neurona on June 2, 2026. The company publishes no public
  API, developer program, SDK, or machine-readable specification; its public surface is corporate and
  clinical, not developer-facing.
